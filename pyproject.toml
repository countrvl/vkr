[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-bench"
version = "0.1.0"
description = "Benchmark scaffold for comparing NL2SQL models across Spider and BIRD."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research Team" }]
dependencies = [
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]
notebooks = [
  "jupyter>=1.0.0",
  "pandas>=2.0.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["prompt/templates/*.j2"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "rich>=13.9.0",
  "jupyter>=1.0.0",
  "pandas>=2.0.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
