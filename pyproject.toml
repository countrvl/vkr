[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-domains"
version = "0.1.0"
description = "Benchmark scaffold for multiple model-evaluation domains, including NL2SQL and code generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research Team" }]
dependencies = [
  "evalplus>=0.3.1",
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]
notebooks = [
  "jupyter>=1.0.0",
  "pandas>=2.0.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "code"]
include = ["nl2sql*", "code_bench*", "shared*"]

[tool.setuptools.package-data]
"nl2sql.src" = ["prompt/templates/*.j2"]
"code_bench" = ["prompt/templates/*.j2"]
"shared" = ["configs/*.yaml"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "rich>=13.9.0",
  "jupyter>=1.0.0",
  "pandas>=2.0.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "code"]
testpaths = ["nl2sql/tests", "code/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "*.ipynb",
  "results/**",
  "*.egg-info/**",
]

[tool.ruff.lint.per-file-ignores]
"nl2sql/scripts/*.py" = ["E402"]
"code/scripts/*.py" = ["E402"]
