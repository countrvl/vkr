models_config_path: ${L2SB_MODELS_CONFIG_PATH:-configs/models.yaml}

experiments:
  spider_env_demo:
    dataset: ${L2SB_DATASET:-spider}
    dataset_path: ${L2SB_DATASET_PATH:-datasets/spider/sample.jsonl}
    model: ${L2SB_MODEL_KEY:-ollama_default}
    k: ${L2SB_K:-1}
    limit: ${L2SB_LIMIT:-}
    db_path: ${L2SB_DB_PATH:-}

  bird_env_demo:
    dataset: ${L2SB_DATASET_BIRD:-bird}
    dataset_path: ${L2SB_DATASET_PATH_BIRD:-datasets/bird/sample.jsonl}
    model: ${L2SB_MODEL_KEY_BIRD:-api_default}
    k: ${L2SB_K_BIRD:-1}
    limit: ${L2SB_LIMIT_BIRD:-}
    db_path: ${L2SB_DB_PATH_BIRD:-}
