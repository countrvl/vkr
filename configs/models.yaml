models:
  m1_deepseek:
    name: "DeepSeek"
    backend: "api"
    model_id: "deepseek-chat"
    model_id_env: "DEEPSEEK_MODEL_ID"
    base_url: "https://api.deepseek.com"
    base_url_env: "DEEPSEEK_API_URL"
    env_key: "DEEPSEEK_API_KEY"
    pricing:
      input_per_1m: 0.28
      output_per_1m: 0.42
      cache_hit_per_1m: 0.028
    parameters:
      max_tokens: 512

  m1_chatgpt:
    name: "ChatGPT"
    backend: "api"
    model_id: "openai/gpt-5.2"
    model_id_env: "OPENAI_MODEL_ID"
    base_url: "https://api.openai.com/v1"
    base_url_env: "OPENAI_API_URL"
    env_key: "OPENAI_API_KEY"
    pricing:
      input_per_1m: 1.25
      output_per_1m: 10.0
      cache_hit_per_1m: 0.125
    parameters:
      max_tokens: 512

  m2_defog:
    name: "Defog-Llama3-SQLCoder-8B"
    backend: "ollama"
    model_id: "mannix/defog-llama3-sqlcoder-8b:q4_0"
    base_url: "http://localhost:11434"
    base_url_env: "OLLAMA_API_URL"
    pricing:
      input_per_1m: 0.0
      output_per_1m: 0.0
    parameters:
      max_tokens: 512
      num_ctx: 4096

  m2_hrida:
    name: "Hrida-T2SQL"
    backend: "ollama"
    model_id: "HridaAI/hrida-t2sql:q8_0"
    base_url: "http://localhost:11434"
    base_url_env: "OLLAMA_API_URL"
    pricing:
      input_per_1m: 0.0
      output_per_1m: 0.0
    parameters:
      max_tokens: 512
      num_ctx: 4096

  m2_arctic:
    name: "Arctic-Text2SQL-R1-7B"
    backend: "ollama"
    model_id: "a-kore/Arctic-Text2SQL-R1-7B:latest"
    base_url: "http://localhost:11434"
    base_url_env: "OLLAMA_API_URL"
    pricing:
      input_per_1m: 0.0
      output_per_1m: 0.0
    parameters:
      max_tokens: 512
      num_ctx: 4096
